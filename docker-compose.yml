x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quota}:${POSTGRES_PASSWORD:-quota_dev}@postgres:5432/${POSTGRES_DB:-quota}
    REDIS_URL: redis://redis:6379/0
    KEY_PEPPER: ${KEY_PEPPER:-dev-only-pepper-change-me}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-only-admin-token-change-me}
    ROTATION_GRACE_SECONDS: ${ROTATION_GRACE_SECONDS:-86400}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # No published ports: instances are reachable only through nginx (DESIGN A-12).
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quota_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quota}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quota} -d ${POSTGRES_DB:-quota}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Durability settings from DESIGN D-11.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    <<: *app

  app2:
    <<: *app

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

  # worker: added when the usage pipeline is built (DESIGN section 16).

volumes:
  pgdata:
  redisdata: