events {}

http {
    upstream quota_api {
        server app1:8000;
        server app2:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://quota_api;
            proxy_set_header Host $host;
            # Trusted request id: always overwritten, never taken from the client (DESIGN D-14).
            proxy_set_header X-Request-ID $request_id;
            # Retry a failed attempt on the other instance (GET is idempotent).
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }
    }
}